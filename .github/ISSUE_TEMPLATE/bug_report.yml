name: Bug report
description: Report a reproducible TempestKeep defect without sensitive data.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: >-
        Do not include a token, station name, coordinate, identifier, serial
        number, archive, export, or raw API response. Use a private security
        advisory for a vulnerability or secret exposure.
  - type: input
    id: revision
    attributes:
      label: Source revision or version
      description: Run `git rev-parse HEAD` when building from source.
      placeholder: 40-character commit ID or release version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, architecture, and `go version` when relevant.
      placeholder: macOS arm64; go version go1.27.0 darwin/arm64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest exact command or MCP sequence using synthetic values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Redact credentials, identifiers, paths, payloads, and URLs before pasting text.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: >-
            I removed credentials, station data, archives, exports, personal
            paths, and raw API responses.
          required: true
