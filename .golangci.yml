# golangci-lint v2.12.2 configuration.
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - govet
    - ineffassign
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
  exclusions:
    presets:
      - common-false-positives
    rules:
      - path: _test\.go
        linters: [unparam]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
